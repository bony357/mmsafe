name = "mmsafe-admin"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Uzupełnij przed wdrożeniem:
GITHUB_REPO = "bony357/mmsafe"
GITHUB_BRANCH = "main"
# Adres strony (bez ścieżki). Kilka adresów oddziel przecinkami, np. dla testów lokalnych.
ALLOWED_ORIGIN = "https://bony357.github.io"

# Sekrety (NIE wpisuj ich tutaj) – ustaw poleceniami:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put GITHUB_TOKEN

# Limit prób logowania: 5 na minutę z jednego adresu IP.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
