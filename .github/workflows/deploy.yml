name: Wdrożenie na dhosting (mmsafe.pl)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Wgrywanie po FTP nie może zostać przerwane w połowie – kolejne wdrożenie czeka na poprzednie
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://mmsafe.pl
          BASE_PATH: /
          PUBLIC_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
      # Wgrywa tylko zmienione pliki (stan trzymany w .ftp-deploy-sync-state.json na serwerze).
      # Usuwa wyłącznie pliki, które sam wcześniej wgrał – reszta katalogu zostaje nietknięta.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR }}
